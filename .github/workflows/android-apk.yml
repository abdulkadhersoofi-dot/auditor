name: Build Android APK

on:
  push:
    branches: [android-apk, main, claude/busy-johnson-b9qm70]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build bundled web app
        run: npm run build:android

      - name: Sync into Android project
        run: npx cap sync android

      # Capacitor 8 generates Java 21 sources (sourceCompatibility = VERSION_21).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify web assets are inside the APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          unzip -l "$APK" | grep -E "assets/public/(index.html|assets/)"

      - uses: actions/upload-artifact@v4
        with:
          name: daftar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
